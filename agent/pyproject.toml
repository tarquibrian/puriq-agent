[project]
name = "puriq"
version = "0.1.0"
description = "Agente especializado que convierte recursos turisticos dispersos de un gobierno local en un sitio web profesional y mantenible."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",          # CLI
    "rich>=13",             # salida en terminal
    "fastapi>=0.111",       # wizard web local
    "python-multipart>=0.0.9",  # /api/chat multipart: adjuntos del chat conversacional
    "uvicorn[standard]>=0.30",  # server del wizard (incluye websockets para /ws/build)
    "jsonschema>=4.22",     # validacion del contrato
    "boto3>=1.34",          # AWS: Bedrock, S3, Location Service
    "httpx>=0.27",          # OSM/Wikidata/Nominatim
]

[project.optional-dependencies]
local = ["ollama>=0.3"]     # modo LLM local opcional
mcp = ["mcp>=1.0,<2"]   # servidor MCP (la API cambio en 2.0: ver puriq/mcp/server.py)
pdf = ["pypdf==6.0.0"]      # extraccion de texto de PDF (version fijada)
test = [
    "pytest>=8",            # test runner
    "hypothesis>=6",        # property-based testing
    # Las pruebas del PDF_Extractor leen PDFs reales, asi que necesitan la
    # biblioteca de verdad: sin ella se saltaria justo el camino que validan.
    # Se referencia el extra `pdf` para no duplicar la version fijada.
    "puriq[pdf]",
]

[project.scripts]
puriq = "puriq.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# La plantilla Astro y los JSON Schema viven en la raiz del repositorio, fuera de
# este paquete, pero son parte del producto: sin ellos `puriq build` no puede
# generar nada. Se copian dentro de la rueda para que una instalacion con pipx
# funcione sin el repositorio alrededor. `puriq.paths` los busca ahi primero y
# cae a la raiz del repo cuando se trabaja sobre el clon.
#
# Pesan ~440 KB en total. Se excluye `node_modules` y `dist` de la plantilla: el
# build instala las dependencias en su propia copia de trabajo.
[tool.hatch.build.targets.wheel.force-include]
"../schemas" = "puriq/_bundled/schemas"
"../template/src" = "puriq/_bundled/template/src"
"../template/public" = "puriq/_bundled/template/public"
"../template/package.json" = "puriq/_bundled/template/package.json"
"../template/package-lock.json" = "puriq/_bundled/template/package-lock.json"
"../template/astro.config.mjs" = "puriq/_bundled/template/astro.config.mjs"
# Un ejemplo completo, para que `puriq demo` genere un sitio real recien
# instalado, sin pedirle nada al usuario. Se listan las carpetas de contenido una
# por una a proposito: `dist/` y `.puriq-build/` (que llega a 167 MB con las
# dependencias de la plantilla) quedan fuera.
"../examples/potosi-bo/tourism-data.json" = "puriq/_bundled/examples/potosi-bo/tourism-data.json"
"../examples/potosi-bo/site.config.json" = "puriq/_bundled/examples/potosi-bo/site.config.json"
"../examples/potosi-bo/theme.tokens.json" = "puriq/_bundled/examples/potosi-bo/theme.tokens.json"
"../examples/potosi-bo/content" = "puriq/_bundled/examples/potosi-bo/content"
"../examples/potosi-bo/assets" = "puriq/_bundled/examples/potosi-bo/assets"
