[project]
name = "puriq"
version = "0.1.0"
description = "Agente especializado que convierte recursos turisticos dispersos de un gobierno local en un sitio web profesional y mantenible."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",          # CLI
    "rich>=13",             # salida en terminal
    "fastapi>=0.111",       # wizard web local
    "python-multipart>=0.0.9",  # /api/chat multipart: adjuntos del chat conversacional
    "uvicorn[standard]>=0.30",  # server del wizard (incluye websockets para /ws/build)
    "jsonschema>=4.22",     # validacion del contrato
    "boto3>=1.34",          # AWS: Bedrock, S3, Location Service
    "httpx>=0.27",          # OSM/Wikidata/Nominatim
]

[project.optional-dependencies]
local = ["ollama>=0.3"]     # modo LLM local opcional
mcp = ["mcp>=1.0"]          # servidor MCP
pdf = ["pypdf==6.0.0"]      # extraccion de texto de PDF (version fijada)
test = [
    "pytest>=8",            # test runner
    "hypothesis>=6",        # property-based testing
    # Las pruebas del PDF_Extractor leen PDFs reales, asi que necesitan la
    # biblioteca de verdad: sin ella se saltaria justo el camino que validan.
    # Se referencia el extra `pdf` para no duplicar la version fijada.
    "puriq[pdf]",
]

[project.scripts]
puriq = "puriq.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
